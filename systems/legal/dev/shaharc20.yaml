---
# Source: paymentgateway/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: paymentgateway-cm
data:
  dbname: "DB_MYSQL"
  dbtable: music
  k8s: v1.31.0
---
# Source: paymentgateway/templates/service.yaml
kind: Service
apiVersion: v1
metadata:
  name: paymentgateway #from RELEASE NAME
  labels:
    app: paymentgateway
spec:
  selector:
    app: paymentgateway
  type: NodePort  #from values
  ports:
  - name: http
    protocol: TCP
    port: 80 #from Values
    targetPort: 8000  #from values
---
# Source: paymentgateway/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paymentgateway
spec:
  selector: 
    matchLabels:
      app: paymentgateway
  replicas: 1   #from values
  template:
    metadata:
      labels:
        app: paymentgateway
    spec:
      containers:
      - name: paymentgateway #from values
        image: shaharc20/paymentgateway:11 #from values
        ports:
        - containerPort: 8000
---
# Source: paymentgateway/templates/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: paymentgateway
  labels:
    app: monitoring
    release: prometheus
spec:
  selector:
    matchLabels:
      app: paymentgateway
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
