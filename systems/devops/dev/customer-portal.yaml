---
# Source: spring-music/templates/configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-portal-cm
data:
  dbname: "DB_MYSQL"
  dbtable: music
  k8s: v1.31.0
---
# Source: spring-music/templates/service.yaml
kind: Service     
apiVersion: v1     
metadata:
  name: customer-portal #from RELEASE NAME
spec:
  selector:
    app: customer-portal    
  type: NodePort  #from values
  ports:         
  - name: http   
    protocol: TCP
    port: 80 #from Values
    targetPort: 8000  #from values
---
# Source: spring-music/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-portal
spec:
  selector: 
    matchLabels:
      app: customer-portal
  replicas: 1   #from values
  template:
    metadata:
      labels:
        app: customer-portal
    spec:
      containers:
      - name: customer-portal #from values
        image: dsohar/customer-portal:10 #from values
        ports:
        - containerPort: 8000
