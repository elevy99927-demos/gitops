apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "html-app.name" . }}
  labels:
    {{- include "html-app.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "html-app.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "html-app.labels" . | nindent 8 }}
      annotations:
        # roll the pods when the page changes
        checksum/html: {{ include "html-app.page" . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: nginx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: html
          configMap:
            name: {{ include "html-app.name" . }}-html
