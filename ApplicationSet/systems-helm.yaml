apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: systems-helm
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/elevy99927-demos/gitops.git
        revision: main
        files:
          # one file = one Application. The lab runs on one kind cluster, so only "dev" is deployed.
          # For every environment use: systems/*/*/*.yaml
          - path: "systems/*/dev/*.yaml"
  # For every matched file, e.g. systems/hr/dev/student07.yaml:
  #   .path.path     = systems/hr/dev
  #   .path.segments = [systems, hr, dev]
  #   .path.filename = student07.yaml
  template:
    metadata:
      # hr-dev-student07
      name: '{{index .path.segments 1}}-{{index .path.segments 2}}-{{.path.filename | trimSuffix ".yaml"}}'
      labels:
        department: '{{index .path.segments 1}}'
        env: '{{index .path.segments 2}}'
        app: '{{.path.filename | trimSuffix ".yaml"}}'
    spec:
      project: default
      sources:
        # 1. Chart from the Helm repo
        - repoURL: https://stefanprodan.github.io/podinfo
          chart: podinfo
          targetRevision: 6.5.0
          helm:
            releaseName: '{{.path.filename | trimSuffix ".yaml"}}'
            valueFiles:
              - $values/{{.path.path}}/{{.path.filename}}
        # 2. Values from the GitOps repo
        - repoURL: https://github.com/elevy99927-demos/gitops.git
          targetRevision: main
          ref: values
      destination:
        # single-cluster lab. Multi-cluster: name: '{{index .path.segments 2}}'
        server: https://kubernetes.default.svc
        # one namespace per department
        namespace: '{{index .path.segments 1}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
