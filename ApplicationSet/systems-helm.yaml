apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: systems-helm
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # One element = one Helm chart from a public Helm repo.
    # Its values file lives in this repo: monitoring/<env>/<app>.yaml
    # The lab runs on one kind cluster, so only "dev" is deployed.
    - list:
        elements:
          # Prometheus Operator + Prometheus + Alertmanager + Grafana (also installs the ServiceMonitor CRDs)
          - app: prometheus
            env: dev
            repoURL: https://prometheus-community.github.io/helm-charts
            chart: kube-prometheus-stack
            version: 84.3.0
          # Loki, single binary, filesystem storage
          - app: loki
            env: dev
            repoURL: https://grafana.github.io/helm-charts
            chart: loki
            version: 7.0.0
          # Promtail: ships pod logs to Loki
          - app: promtail
            env: dev
            repoURL: https://grafana.github.io/helm-charts
            chart: promtail
            version: 6.17.1
  template:
    metadata:
      # monitoring-dev-prometheus
      name: 'monitoring-{{.env}}-{{.app}}'
      labels:
        department: monitoring
        env: '{{.env}}'
        app: '{{.app}}'
    spec:
      project: default
      sources:
        # 1. Chart from the Helm repo
        - repoURL: '{{.repoURL}}'
          chart: '{{.chart}}'
          targetRevision: '{{.version}}'
          helm:
            # release name = app name: Loki's service is "loki" (used by Grafana and Promtail),
            # and ServiceMonitors with the label "release: prometheus" are picked up
            releaseName: '{{.app}}'
            valueFiles:
              - $values/monitoring/{{.env}}/{{.app}}.yaml
        # 2. Values from the GitOps repo
        - repoURL: https://github.com/elevy99927-demos/gitops.git
          targetRevision: main
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: monitoring
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          # the Prometheus Operator CRDs are too big for client-side apply (annotation size limit)
          - ServerSideApply=true
